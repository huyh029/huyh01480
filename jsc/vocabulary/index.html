<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vocabulary</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .home{
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 70px 0 0 0;
        }
        .home_lesson, .home_test{
            cursor: pointer;
            display: flex;
            padding: 20px;
            align-items: center;
            font-size: 70px;
            color: rgb(39, 39, 39);
            height: 100px;
            border-radius: 40px;
            background: linear-gradient(150deg,rgb(192, 241, 255),rgb(73, 203, 255));
        }
        .home_test{
            background: linear-gradient(150deg,rgb(20, 20, 20),rgb(255, 33, 33));
            color: white;
        }
        .home_search
        {
            height: 20px;
            border: none;
            outline: none;
            width: 90%;
            padding: 10px 15px;
            background: linear-gradient(150deg,rgb(192, 241, 255),rgb(73, 203, 255));
            border-radius: 0 25px 0 25px;
        }
        .home_box_search{
            position: fixed;
            height: 70px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        a{
            text-decoration: none;
        }
    </style>
</head>
<body>  
    <div class="home">
        <div class="home_box_search">
            <input type="text" class="home_search">
            <a href=""></a>
        </div>
    </div>
</body>
<script>
    var home=document.querySelector(".home");
    for(var i=1;i<=25;i++)
        home.innerHTML+=`<a href="${i}" onclick="return false;"><div class="home_lesson">10 từ thứ ${i}</div></a>`;
    home.innerHTML+=`<a href="test 1" onclick="return false;"><div class="home_test">test 1</div> </a>`;
    for(var i=26;i<=50;i++)
        home.innerHTML+=`<a href="${i}" onclick="return false;"><div class="home_lesson">10 từ thứ ${i}</div></a>`;
    home.innerHTML+=`<a href="test 2" onclick="return false;"><div class="home_test">test 2</div> </a>`;
    for(var i=51;i<=75;i++)
        home.innerHTML+=`<a href="${i}" onclick="return false;"><div class="home_lesson">10 từ thứ ${i}</div></a>`;
    home.innerHTML+=`<a href="test 3" onclick="return false;"><div class="home_test">test 3</div> </a>`;
    for(var i=76;i<=100;i++)
        home.innerHTML+=`<a href="${i}" onclick="return false;"><div class="home_lesson">10 từ thứ ${i}</div></a>`;
    home.innerHTML+=`<a href="test 4" onclick="return false;"><div class="home_test">test 4</div> </a>`;
    document.addEventListener("keydown",e => {
        var home_search=document.querySelector(".home_search");
        home_search.focus();
        if(home_search.textContent.trim()!=NaN)
        {
            var index=home_search.value.trim();
            home.children[index].scrollIntoView({ behavior: 'smooth' });
        }
    })
</script>
</html>
